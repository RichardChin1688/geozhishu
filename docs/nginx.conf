# geozhishu.com — Nginx 配置参考
# 放置：/etc/nginx/conf.d/geozhishu.conf
# 站点根目录：/var/www/geozhishu

server {
    listen 80;
    listen [::]:80;
    server_name geozhishu.com www.geozhishu.com;
    # HTTP 全部跳 HTTPS
    return 301 https://geozhishu.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name geozhishu.com;

    root /var/www/geozhishu;
    index index.html;

    # ---- SSL（Let's Encrypt / 云厂商证书路径按实际改）----
    ssl_certificate     /etc/letsencrypt/live/geozhishu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geozhishu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 压缩 ----
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # ---- 缓存策略 ----
    # HTML 不缓存（数据每周更新，必须拿到新版）
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ =404;
    }
    # 静态资源长缓存（改版时靠文件名或 query 变化）
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---- 尾部斜杠归一 ----
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ---- 站内跳转（旧路径兼容，按需保留）----
    error_page 404 /index.html;

    access_log /var/log/nginx/geozhishu.access.log;
    error_log  /var/log/nginx/geozhishu.error.log;
}

# www 跳主域
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.geozhishu.com;

    ssl_certificate     /etc/letsencrypt/live/geozhishu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geozhishu.com/privkey.pem;

    return 301 https://geozhishu.com$request_uri;
}
