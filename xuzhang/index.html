<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>序章 prologuetea · 品牌诊断系统</title>
<style>
/* ============================================================
   盛启橙 · 品牌诊断系统 — 统一样式表 v2.0（深空玻璃大屏风）
   设计语言：深空渐变 × 毛玻璃卡片 × 青蓝主色 × 数据高亮
   ============================================================ */

:root {
  /* 色板 */
  --bg-0: #070b14;
  --bg-1: #0d1526;
  --bg-2: #131f38;
  --card: rgba(21, 33, 55, 0.96);
  --card-solid: #152137;
  --card-hover: rgba(31, 47, 76, 0.85);
  --primary: #4fc3f7;
  --primary-soft: rgba(79, 195, 247, 0.16);
  --primary-glow: rgba(79, 195, 247, 0.35);
  --success: #66bb6a;
  --success-soft: rgba(102, 187, 106, 0.15);
  --danger: #ef5350;
  --warning: #ffa726;
  --purple: #ab47bc;
  --gold: #ffd54f;
  --text: #e8eef7;
  --text-muted: #b9c8dc;
  --text-dim: #8b9db6;
  --border: rgba(130, 160, 200, 0.14);
  --border-strong: rgba(130, 160, 200, 0.28);

  /* 字体与圆角 */
  --font-num: 'DIN Alternate', 'Bahnschrift', 'Roboto Mono', 'SF Mono', Consolas, monospace;
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;

  /* 阴影 */
  --shadow-card: 0 10px 30px -12px rgba(0, 0, 0, 0.55);
  --shadow-lift: 0 18px 44px -14px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(79, 195, 247, 0.12);
  --shadow-glow: 0 0 22px -2px var(--primary-glow);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 84px;
}

body {
  font-family: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  color: var(--text);
  line-height: 1.65;
  min-height: 100vh;
  background:
    radial-gradient(1100px 520px at 85% -10%, rgba(79, 195, 247, 0.13), transparent 60%),
    radial-gradient(900px 480px at -10% 8%, rgba(102, 187, 106, 0.08), transparent 55%),
    radial-gradient(1000px 600px at 50% 115%, rgba(171, 71, 188, 0.07), transparent 60%),
    linear-gradient(165deg, var(--bg-1) 0%, var(--bg-0) 55%, #0a1220 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}

/* 细网格纹理（叠加在背景上） */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(rgba(130, 170, 220, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(130, 170, 220, 0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 78%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 78%);
}

::selection { background: var(--primary-soft); color: #fff; }

/* 滚动条 */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, rgba(79, 195, 247, 0.35), rgba(79, 195, 247, 0.12));
  border-radius: 8px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, rgba(79, 195, 247, 0.6), rgba(79, 195, 247, 0.25)); background-clip: padding-box; }

/* SVG 行内图标 */
.ic {
  width: 1.15em;
  height: 1.15em;
  vertical-align: -0.2em;
  flex: none;
  stroke: currentColor;
  filter: drop-shadow(0 0 6px rgba(79, 195, 247, 0.35));
}
.topbar h1 .logo-mark .ic { width: 1.5em; height: 1.5em; }
.chart-box h3 .ic { color: #9cdcff; }
.section-nav a .ic { width: 1em; height: 1em; vertical-align: -0.12em; }
.section-nav a.active .ic { filter: none; }

/* ============ 顶部导航 ============ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 14px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  background: rgba(10, 16, 28, 0.72);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 8px 32px -14px rgba(0, 0, 0, 0.6);
}
.topbar h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}
.topbar h1 .logo-mark {
  width: 34px; height: 34px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  border-radius: 10px;
  background: linear-gradient(140deg, rgba(79, 195, 247, 0.28), rgba(102, 187, 106, 0.18));
  border: 1px solid var(--border-strong);
  box-shadow: inset 0 0 12px rgba(79, 195, 247, 0.25), 0 0 14px -4px var(--primary-glow);
}
.topbar h1 .grad {
  background: linear-gradient(92deg, #8fd8ff 5%, #4fc3f7 45%, #66bb6a 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.topbar .meta {
  color: var(--text-muted);
  font-size: 12.5px;
  text-align: right;
  line-height: 1.7;
}
.topbar .meta .chip {
  display: inline-block;
  padding: 2px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: #7dd8ff;
  background: var(--primary-soft);
  border: 1px solid rgba(79, 195, 247, 0.35);
  box-shadow: 0 0 12px -3px var(--primary-glow);
  animation: chipPulse 3s ease-in-out infinite;
}
@keyframes chipPulse {
  0%, 100% { box-shadow: 0 0 10px -4px var(--primary-glow); }
  50% { box-shadow: 0 0 18px -2px var(--primary-glow); }
}

/* ============ 布局容器 ============ */
.container {
  position: relative;
  z-index: 1;
  max-width: 1440px;
  margin: 0 auto;
  padding: 30px 32px 40px;
}

/* ============ 卡片 ============ */
.card, .chart-box, .metric {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.045);
  position: relative;
}

/* 卡片顶部高光线 */
.card::before, .chart-box::before {
  content: '';
  position: absolute;
  top: 0; left: 8%; right: 8%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(160, 210, 255, 0.28), transparent);
  pointer-events: none;
}

.card {
  padding: 24px 26px;
  margin-bottom: 24px;
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  animation: riseIn 0.5s ease both;
}
.card:nth-of-type(1) { animation-delay: 0.02s; }
.card:nth-of-type(2) { animation-delay: 0.06s; }
.card:nth-of-type(3) { animation-delay: 0.10s; }
@keyframes riseIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card:hover {
  border-color: var(--border-strong);
  transform: translateY(-2px);
  box-shadow: var(--shadow-lift);
}

.card h2 {
  color: var(--primary);
  margin-bottom: 18px;
  font-size: 17.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
  padding-left: 16px;
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
}
.card h2 .ic { color: var(--primary); }
.card h2::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 4px; height: 22px;
  border-radius: 3px;
  background: linear-gradient(180deg, var(--primary), rgba(79, 195, 247, 0.1));
  box-shadow: 0 0 10px var(--primary-glow);
}
.card h2 .sub {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0;
}

.card h3 {
  color: var(--text);
  margin: 18px 0 10px;
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card h3 .ic { color: var(--primary); opacity: 0.9; }
.card h3:first-child { margin-top: 0; }

/* ============ 网格 ============ */
.grid {
  display: grid;
  gap: 22px;
}
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }

/* ============ 数字卡片 ============ */
.metric {
  padding: 22px 18px 20px;
  text-align: center;
  overflow: hidden;
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  animation: riseIn 0.55s ease both;
}
.metric:nth-child(1) { animation-delay: 0.02s; }
.metric:nth-child(2) { animation-delay: 0.08s; }
.metric:nth-child(3) { animation-delay: 0.14s; }
.metric:nth-child(4) { animation-delay: 0.20s; }
.metric:hover {
  transform: translateY(-3px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-lift);
}
/* 顶部彩色光带 */
.metric::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  opacity: 0.55;
}
.metric .value {
  font-size: 38px;
  font-weight: 800;
  font-family: var(--font-num);
  letter-spacing: 0.5px;
  margin: 6px 0 2px;
  background: linear-gradient(180deg, #fff 20%, var(--primary) 90%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 12px rgba(79, 195, 247, 0.35));
  line-height: 1.15;
}
.metric .label {
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.4px;
}
.metric .delta-up { color: var(--success); font-size: 13px; font-weight: 600; }
.metric .delta-down { color: var(--danger); font-size: 13px; font-weight: 600; }
.metric .delta-flat { color: var(--warning); font-size: 13px; font-weight: 500; }

/* ============ 板块导航 ============ */
.section-nav {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 28px;
}
.section-nav a {
  position: relative;
  padding: 9px 20px;
  background: rgba(21, 33, 55, 0.6);
  border: 1px solid var(--border);
  border-radius: 26px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.22s ease;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.section-nav a:hover {
  color: #cdeaff;
  border-color: rgba(79, 195, 247, 0.45);
  background: rgba(79, 195, 247, 0.10);
  transform: translateY(-1px);
  box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.5);
}
.section-nav a.active {
  color: #06121f;
  font-weight: 700;
  background: linear-gradient(135deg, #6fd1ff, #38a9e8 55%, #4dd0c4);
  border-color: transparent;
  box-shadow: 0 4px 18px -4px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,0.4);
}

/* ============ 评分条 ============ */
.score-bar {
  background: rgba(130, 160, 200, 0.14);
  border-radius: 6px;
  height: 9px;
  overflow: hidden;
  position: relative;
}
.score-bar .fill {
  height: 100%;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--primary), var(--success));
  box-shadow: 0 0 8px rgba(79, 195, 247, 0.35);
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
/* 高分段渐变金 / 低分段警示 */
.score-bar .fill.hi  { background: linear-gradient(90deg, #4dd0c4, #66bb6a); }
.score-bar .fill.lo  { background: linear-gradient(90deg, #ffb74d, var(--warning)); box-shadow: 0 0 8px rgba(255, 167, 38, 0.3); }

.score-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 9px 0;
  font-size: 14px;
  gap: 10px;
}
.score-row .name {
  flex: 1;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 90px;
}
.score-row .num {
  font-family: var(--font-num);
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  min-width: 22px;
  text-align: right;
  text-shadow: 0 0 10px rgba(79, 195, 247, 0.3);
}

/* ============ 标签 ============ */
.tag {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.4px;
  margin-right: 4px;
  vertical-align: 1px;
}
.tag.green  { background: var(--success-soft); color: #8fdc93; border: 1px solid rgba(102, 187, 106, 0.35); }
.tag.red    { background: rgba(239, 83, 80, 0.14); color: #ff8a80; border: 1px solid rgba(239, 83, 80, 0.32); }
.tag.orange { background: rgba(255, 167, 38, 0.13); color: #ffc06e; border: 1px solid rgba(255, 167, 38, 0.32); }
.tag.blue   { background: var(--primary-soft); color: #7dd8ff; border: 1px solid rgba(79, 195, 247, 0.32); }
.tag.purple { background: rgba(171, 71, 188, 0.15); color: #d58ce0; border: 1px solid rgba(171, 71, 188, 0.35); }

/* ============ 列表 ============ */
ul.bullet {
  list-style: none;
  padding-left: 0;
}
ul.bullet li {
  padding: 7px 0 7px 26px;
  position: relative;
  color: var(--text);
  font-size: 14.5px;
  transition: padding-left 0.2s ease;
}
ul.bullet li::before {
  content: '';
  position: absolute;
  left: 4px; top: 50%;
  transform: translateY(-50%);
  width: 7px; height: 7px;
  border-radius: 2px;
  background: linear-gradient(135deg, var(--primary), #4dd0c4);
  box-shadow: 0 0 8px rgba(79, 195, 247, 0.5);
}
ul.bullet li:hover { padding-left: 30px; color: #fff; }
ul.bullet li strong, ul.bullet li b { color: #fff; font-weight: 600; }

/* ============ 图表容器 ============ */
.chart-box {
  padding: 18px 18px 12px;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.chart-box:hover { border-color: var(--border-strong); box-shadow: var(--shadow-lift); }
.chart-box h3 {
  color: #9cdcff;
  font-size: 14.5px;
  font-weight: 600;
  margin: 0 0 14px;
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 图表固定高度容器（Chart.js 4 需要父级定高才不撑破） */
.chart-wrap {
  position: relative;
  height: 330px;
}
.chart-wrap.tall { height: 380px; }
.chart-wrap.short { height: 280px; }
.chart-wrap canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }

/* 占位微文案（canvas 渲染前的优雅降级） */
.chart-wrap .ph {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim);
  font-size: 13px;
  letter-spacing: 2px;
}

/* ============ 表格 ============ */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  margin-top: 12px;
}
table.brand-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  min-width: 720px;
}
.brand-table thead th {
  text-align: left;
  padding: 12px 14px;
  color: var(--text-muted);
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: 0.6px;
  background: rgba(130, 160, 200, 0.07);
  border-bottom: 1px solid var(--border-strong);
  white-space: nowrap;
}
.brand-table tbody td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.brand-table tbody tr { transition: background 0.15s ease; }
.brand-table tbody tr:hover { background: rgba(79, 195, 247, 0.05); }
.brand-table tbody tr:last-child td { border-bottom: none; }

/* ============ 价格卡（产品矩阵） ============ */
.metric .price {
  font-family: var(--font-num);
  font-size: 22px;
  font-weight: 700;
  margin: 8px 0 4px;
  letter-spacing: 0.3px;
  line-height: 1.2;
}
.metric .price[data-tone="warn"] { color: #ffb74d; text-shadow: 0 0 14px rgba(255, 167, 38, 0.25); }
.metric .price[data-tone="ok"]   { color: #8fdc93; text-shadow: 0 0 14px rgba(102, 187, 106, 0.25); }
.metric .price[data-tone="prim"] { color: #7dd8ff; text-shadow: 0 0 14px rgba(79, 195, 247, 0.3); }

/* ============ 调研节点时间轴 ============ */
.timeline {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 18px;
  position: relative;
  padding-top: 6px;
}
.tl-node {
  flex: 1;
  min-width: 148px;
  text-align: center;
  padding: 18px 14px 16px;
  border-radius: var(--radius-md);
  background: var(--card);
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.25s ease;
  position: relative;
}
.tl-node::before {
  content: '';
  position: absolute;
  top: -6px; left: 50%;
  transform: translateX(-50%);
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--text-dim);
  border: 2px solid var(--card-solid);
  box-shadow: 0 0 0 2px var(--border);
}
.tl-node:hover {
  transform: translateY(-3px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-lift);
}
.tl-node.current {
  background: linear-gradient(160deg, rgba(79, 195, 247, 0.16), rgba(21, 33, 55, 0.8));
  border-color: rgba(79, 195, 247, 0.55);
  box-shadow: 0 0 22px -6px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,0.06);
}
.tl-node.current::before {
  background: var(--primary);
  border-color: rgba(79, 195, 247, 0.4);
  box-shadow: 0 0 10px var(--primary-glow);
}
.tl-label {
  font-size: 13px;
  color: var(--text);
  font-weight: 600;
  letter-spacing: 0.3px;
}
.tl-date {
  font-family: var(--font-num);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-muted);
  margin: 6px 0 8px;
}
.tl-node.current .tl-date { color: #8fd8ff; }
.tl-tag {
  display: inline-block;
  font-size: 11.5px;
  color: #b8c7db;
  background: rgba(130, 160, 200, 0.1);
  border: 1px solid var(--border-strong);
  padding: 2px 10px;
  border-radius: 20px;
}
.tl-node.current .tl-tag {
  color: #06121f;
  font-weight: 700;
  background: linear-gradient(135deg, #6fd1ff, #38a9e8);
  border-color: transparent;
  box-shadow: 0 2px 10px -2px var(--primary-glow);
}

/* ============ 底部 ============ */
.footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 34px 24px;
  color: var(--text-dim);
  font-size: 12.5px;
  line-height: 1.9;
  border-top: 1px solid var(--border);
  margin-top: 20px;
  background: linear-gradient(180deg, transparent, rgba(10, 16, 28, 0.6));
}
.footer b { color: var(--text-muted); font-weight: 600; }

/* ============ 响应式 ============ */
@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 860px) {
  .topbar { flex-direction: column; align-items: flex-start; padding: 14px 20px; }
  .topbar .meta { text-align: left; }
  .container { padding: 22px 16px 30px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .card { padding: 20px; }
  .chart-wrap { height: 260px; }
}
@media (max-width: 560px) {
  .grid-4 { grid-template-columns: 1fr; }
  .topbar h1 { font-size: 17px; }
  .metric .value { font-size: 32px; }
}

/* 尊重减弱动效偏好 */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .card, .metric { animation: none; }
  .score-bar .fill { transition: none; }
  .topbar .meta .chip { animation: none; }
}

/* ============================================================
   [v2.0 数据驱动模板 · 渲染器所需补充布局]（版式固定层）
   ============================================================ */

/* 双栏 / 三栏通用片段容器 */
.split-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin-top: 16px;
}
.split-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
  margin-top: 16px;
}
@media (max-width: 860px) {

/* 总览两图（雷达 + 28 模块）并排：≤1100px 收成单列。

/* ===== 表单化：语音播报 + 优化方案 ===== */

.plan-body { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
@media (max-width: 900px){ .plan-body { grid-template-columns: 1fr; } }

/* ============================================================
   照本堂 · 旧版式对比版（v_old）+ 文字跨行治理
   版式尺寸：完全沿用老 10 页（16px 基准 / 13px 正文 / 原间距）
   仅治：① 标题竖排 ② 短标签折行 ③ 表格短文本折行
   ============================================================ */

/* ---------- ① 优化方案标题不被「🎯目标」徽章挤成竖排 ---------- */
.plan-phase-head {
  flex-wrap: wrap;
  align-items: flex-start;
}
.plan-phase-head h3 {
  flex: 1 1 auto;
  min-width: 200px;
  white-space: normal;
  word-break: keep-all;
  line-height: 1.45;
}
.plan-goal {
  flex: 0 0 auto;
  white-space: nowrap;
}

/* ---------- ② 标签竖排：短词一律单行 ----------
   实测：「存续」在 47px 宽、3px 12px 内距的标签里被折成两行（高 48px）。
   根因：.tag 是 inline-block 且未设 white-space，中文可任意断行。 */
.tag {
  white-space: nowrap;
  word-break: keep-all;
  flex-shrink: 0;
}
/* 表格内的标签同样不折 */
.brand-table td .tag,
.brand-table th .tag {
  white-space: nowrap;
}
/* 方案条目里的 P0/P1 标签 */
.plan-item-t .tag {
  white-space: nowrap;
}
.plan-item-t {
  word-break: keep-all;
}

/* ---------- ③ 表格短文本不折行 ----------
   由 render.js 的 markShortCells() 给「≤11 字」单元格加 .cell-nowrap。
   此处确保该标记真正生效，且长文本仍可正常折行。 */
.brand-table td.cell-nowrap,
.brand-table th.cell-nowrap {
  white-space: nowrap;
  word-break: keep-all;
}
/* 长文本单元格：折行但不断词，避免把「科技有限公司」拆开 */
.brand-table tbody td {
  word-break: normal;
  overflow-wrap: break-word;
}
/* 表格内不许撑破卡片 */
.table-wrap {
  max-width: 100%;
  overflow-x: auto;
}
.brand-table {
  max-width: 100%;
}

/* ---------- ④ 评分条：条目名与数值都不硬折 ---------- */
.score-row .name {
  min-width: 0;
  word-break: keep-all;
}
.score-row .num {
  min-width: 0;
  word-break: normal;
  overflow-wrap: break-word;
  text-align: right;
}

/* ---------- ⑤ 指标卡标签不折 ---------- */
.metric .label {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.metric .price {
  white-space: nowrap;
}

/* ---------- ⑥ 产品矩阵说明：折行但不断词 ---------- */
.metric .delta-flat {
  word-break: normal;
  overflow-wrap: break-word;
}

/* ---------- ⑦ 表格首列（主体名）放宽，容纳 12 字公司全名 ----------
   实测：「早期母公司（已退出科技公司）」需 182px，而列内可用仅 170px → 必折。
   注：border-collapse 表格里 min-width 常被忽略，故用 width + nowrap 组合。 */
.brand-table th:nth-child(1),
.brand-table td:nth-child(1) {
  width: 230px;
  min-width: 230px;
}
/* 主体名列：短名一律单行，长名允许折但优先给足宽度 */
.brand-table td:nth-child(1) {
  word-break: keep-all;
  overflow-wrap: break-word;
}
.brand-table thead th:nth-child(1) {
  white-space: nowrap;
}
/* 表格整体再次确认不撑破 */
.brand-table {
  width: 100%;
}

/* ---------- ⑧ 最终处置：仅对「主体结构表」启用固定列宽 ----------
   问题：auto 布局下，浏览器按内容比例分配，首列总被压到 197px（需 210px）。
   处置：给首列一个不可压缩的 col 宽度 + nowrap，长名自然单行。 */
.brand-table td:nth-child(1).cell-nowrap,
.brand-table th:nth-child(1).cell-nowrap {
  white-space: nowrap;
}
/* 放宽「说明」列最小值，让首列有腾挪空间（说明列本就长，折行无妨） */
.brand-table td:nth-child(1) {
  min-width: 220px;
  width: 220px;
}

/* ---------- ⑨ 收尾：主体表「角色」列偏窄导致 14 字标签折行 ----------
   实测：「早期母公司（已退出科技公司）」需 182px，
   而该列在 auto 布局下被压到 170px 可用宽 → 必定折成两行。
   处置：给含长文本的第 2 列一个可靠下限（表格 auto 布局下 min-width 生效于 td）。 */
.brand-table tbody tr td:nth-child(2):not(.cell-nowrap) {
  min-width: 230px;
}

/* ============================================================
   v2.0 三处修订（2026-11-06 16:30）
   ① 顶部导航：与正文两端对齐（撑满卡片宽度）
   ② Persona 卡片：名称列定宽，右侧值列上下对齐
   ③ 页脚署名：王德发 → 启橙教育科技(深圳)有限公司
   ============================================================ */

/* ---------- ① 导航两端对齐 ----------
   实测：导航容器宽 1366px，链接仅排到 1343px，右侧留 55px 空白。
   处置：justify-content: space-between，首尾贴边，中间均分。
   同时取消 flex-wrap 换行（10 个链接在 1366px 内排得下）。 */
.section-nav {
  justify-content: space-between;
  flex-wrap: nowrap;
  gap: 8px;
}
.section-nav a {
  flex: 0 1 auto;
  padding: 9px 14px;
  text-align: center;
  white-space: nowrap;
}
/* 总览与末尾项贴边对齐 */
.section-nav a:first-child {
  margin-left: 0;
}
.section-nav a:last-child {
  margin-right: 0;
}
/* 中等屏幕允许换行，避免挤压 */
@media (max-width: 1280px) {
  .section-nav {
    flex-wrap: wrap;
    justify-content: center;
  }
}

/* ---------- ② Persona 卡片内部对齐 ----------
   实测：.score-row .name 宽度随文字长短变化（28/42/56/70px），
   导致右侧值列起点不齐，三张卡看起来「一列一列地歪」。
   处置：名称列定宽 76px，值列从同一横坐标开始。 */
#user .split-3 .score-row {
  display: grid;
  grid-template-columns: 76px 1fr;
  align-items: start;
  gap: 10px;
}
#user .split-3 .score-row .name {
  width: 76px;
  min-width: 76px;
  text-align: left;
  white-space: nowrap;
  overflow: visible;
  color: var(--text-muted);
  font-size: 13px;
}
#user .split-3 .score-row .num {
  width: auto;
  min-width: 0;
  text-align: left;
  word-break: normal;
  overflow-wrap: break-word;
  line-height: 1.62;
}
/* 三张 Persona 卡片等高，底部对齐 */
#user .split-3 {
  align-items: stretch;
}
#user .split-3 > div {
  display: flex;
  flex-direction: column;
}

/* ---------- ③ 页脚署名 ---------- */
.footer .foot-credit b {
  font-weight: 700;
}

/* ============================================================
   右下角「一键返回顶部」按钮（v2.1 · 2026-11-06）
   图标：小火箭（ICONS.rocket2），由 render.js 的 renderBackTop() 注入
   行为：滚动 >400px 淡入；点击平滑回顶；回顶后自动隐藏
   ============================================================ */
.back-top {
  position: fixed;
  right: 28px;
  bottom: 32px;
  z-index: 900;
  width: 46px;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
  border-radius: 50%;
  /* 与页面深空玻璃风格一致 */
  background: rgba(21, 33, 55, 0.82);
  border: 1px solid rgba(79, 195, 247, 0.38);
  color: #7dd8ff;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.6), 0 0 0 0 rgba(79, 195, 247, 0);
  /* 默认隐藏，滚动后显示 */
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px);
  transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease,
              background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.back-top.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}
.back-top svg {
  width: 24px;
  height: 24px;
}
.back-top:hover {
  background: rgba(79, 195, 247, 0.18);
  border-color: #4fc3f7;
  color: #cdeaff;
  transform: translateY(-2px);
  box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.7), 0 0 16px -2px rgba(79, 195, 247, 0.45);
}
.back-top:active {
  transform: translateY(0) scale(0.95);
}
.back-top:focus-visible {
  outline: 2px solid #4fc3f7;
  outline-offset: 3px;
}

/* 窄屏下按钮缩小、贴边 */
@media (max-width: 900px) {
  .back-top {
    right: 16px;
    bottom: 20px;
    width: 42px;
    height: 42px;
  }
  .back-top svg {
    width: 20px;
    height: 20px;
  }
}

/* 打印时隐藏 */
@media print {
  .back-top { display: none !important; }
}

/* ============================================================
   移动端适配层（2026-11-06 · 陛下钦命「品牌前置调研网页移动端优化」）
   ------------------------------------------------------------------
   背景：原页面只有 3 个断点（1100/860/560），移动端实测三类硬伤：
     ① 指标卡 5 张被 grid-template-columns:repeat(5,1fr) 硬塞一行
        → 每张 ~50px 宽，中文被迫单字竖排（"官/网/公/众/号"），无法阅读
     ② 导航 10 个胶囊换行堆叠 4 行，占掉首屏 ~30% 高度
     ③ 表格 min-width:720px + 首列定宽 230px → 390px 屏横向溢出，
        docW 596 vs vw 390，整页可左右拖动
   处理原则：**只在窄屏生效，桌面版式零改动**（陛下已验收的版式不动）。
   ============================================================ */

/* ---------- 0. 全局：窄屏禁止横向溢出 ---------- */
@media (max-width: 860px) {
  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }
  /* 触屏上卡片 hover 位移会产生「黏住上移」的怪感，直接取消 */
  .card:hover, .metric:hover, .tl-node:hover, .chart-box:hover {
    transform: none;
  }
  /* iOS 点击高亮去掉 */
  body { -webkit-tap-highlight-color: transparent; }
  /* 行内代码/长英文不撑破容器 */
  .card, .sec-body, .plan-body, .voice-script { overflow-wrap: anywhere; }
}

/* ---------- 1. 顶栏：吸顶 + 章节按钮 ---------- */
@media (max-width: 860px) {
  /* 顶栏改 grid：第一行 标题 | 章节按钮，第二行 客户与阶段信息通栏
     反例（已修）：flex 多行里 .meta 的 flex:1 1 100% 会把标题挤到 88px → 标题被截成一字一行 */
  .topbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    padding: 9px 14px 10px;
    gap: 3px 10px;
  }
  .topbar h1 {
    font-size: 15.5px;
    gap: 8px;
    white-space: normal;
    line-height: 1.35;
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
    flex-wrap: nowrap;
  }
  .topbar h1 .logo-mark {
    width: 28px; height: 28px;
    font-size: 14px;
    border-radius: 8px;
  }
  .topbar h1 .grad {
    display: block;
    min-width: 0;
    overflow-wrap: break-word;
    word-break: keep-all;
    line-height: 1.3;
  }
  /* 客户/阶段信息移到标题下方一行，缩小字号，不占整块高度 */
  .topbar .meta {
    grid-column: 1 / -1;
    grid-row: 2;
    text-align: left;
    font-size: 11.5px;
    line-height: 1.55;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    max-width: 100%;
    min-width: 0;
  }
  .topbar .meta .chip { padding: 1px 9px; font-size: 11px; }
  .topbar .head-client { color: var(--text-dim); }
  .head-meta-line { margin-top: 0; }
}

/* 章节抽屉按钮（仅窄屏显示） */
.nav-toggle { display: none; }
@media (max-width: 860px) {
  .nav-toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    grid-column: 2;
    grid-row: 1;
    justify-self: end;
    padding: 8px 12px 8px 11px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 600;
    color: #cdeaff;
    background: rgba(79, 195, 247, 0.13);
    border: 1px solid rgba(79, 195, 247, 0.42);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-toggle .ic { width: 15px; height: 15px; }
  .nav-caret { width: 14px; height: 14px; transition: transform 0.22s ease; opacity: 0.85; }
  .nav-toggle.open .nav-caret { transform: rotate(180deg); }
  .nav-toggle.open { background: rgba(79, 195, 247, 0.24); border-color: #4fc3f7; }

  /* 章节列表改为下拉面板（不再横向撑满正文） */
  .section-nav {
    position: absolute;
    left: 12px;
    right: 12px;
    top: calc(100% + 8px);
    z-index: 120;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 0;
    padding: 12px;
    border-radius: 16px;
    background: rgba(13, 21, 38, 0.97);
    border: 1px solid rgba(79, 195, 247, 0.3);
    box-shadow: 0 22px 50px -16px rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    max-height: 68vh;
    overflow-y: auto;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
  }
  .section-nav.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  /* 层叠顺序比 isolation 可靠：面板必须整体高于遮罩 */
  /* 面板必须整体高于遮罩；同时容器 .container(z-index:1) 会形成层叠上下文
     → 窄屏下容器不再自建上下文，保证 130 > 100 的层级真正生效 */
  .section-nav { z-index: 130 !important; }
  .container { z-index: auto; }
  .section-nav a {
    justify-content: center;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 11px 8px;
    font-size: 13.5px;
    border-radius: 11px;
    min-height: 44px;
  }
  /* 遮罩层级须低于下拉面板（nav z-index:120），否则面板点不动 */
  .nav-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(4, 8, 15, 0.55);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .nav-backdrop.show { opacity: 1; visibility: visible; }
}

/* ---------- 2. 容器与卡片内距 ---------- */
@media (max-width: 860px) {
  .container { padding: 14px 12px 26px; }
  .card { padding: 16px 14px; margin-bottom: 14px; border-radius: 15px; }
  .card h2 { font-size: 15.5px; margin-bottom: 14px; padding-left: 13px; gap: 7px; }
  .card h2::before { width: 3px; height: 18px; }
  .card h2 .sub {
    display: block;
    flex-basis: 100%;
    font-size: 11.5px;
    line-height: 1.5;
    margin-top: 3px;
  }
  .card h2 { flex-wrap: wrap; }
  .card h3 { font-size: 14px; margin: 14px 0 8px; }
  .chart-box { padding: 13px 11px 8px; border-radius: 15px; }
  .chart-box h3 { font-size: 13px; margin-bottom: 10px; }
  .split-2, .split-3 { gap: 14px; margin-top: 12px; }
  ul.bullet li { font-size: 14px; padding: 6px 0 6px 22px; line-height: 1.7; }
  ul.bullet li::before { left: 2px; width: 6px; height: 6px; }
  ul.bullet li:hover { padding-left: 22px; }
  .stat-foot { font-size: 12.5px; }
}

/* ---------- 3. 指标卡：≤860px 横滑单列带（C 档 2026-11-07） ----------
   陛下旨意：不要竖排单列，改横向可滑动。实现：
   grid → flex 横排 + scroll-snap，每卡约 72vw 宽（右侧露出一截，暗示可滑）。
   桌面 >860px 完全不受影响。 */
@media (max-width: 860px) {
  .metric-row,
  #metricRow.metric-row {
    display: flex !important;
    flex-wrap: nowrap !important;
    grid-template-columns: none !important;
    gap: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    scroll-padding-left: 2px;
    /* 让卡片能贴到容器边缘再滑出 */
    padding: 2px 2px 12px;
    margin: 0 -2px;
    scrollbar-width: none;
  }
  .metric-row::-webkit-scrollbar,
  #metricRow.metric-row::-webkit-scrollbar { height: 0; display: none; }

  .metric-row > .metric,
  #metricRow.metric-row > .metric {
    flex: 0 0 auto;
    scroll-snap-align: start;
    /* 72vw：右侧始终露 1/4 张，用户看得见「还有」 */
    width: 72vw;
    min-width: 72vw;
    max-width: 300px;
    text-align: left;
    padding: 15px 16px 16px;
    border-radius: 14px;
  }
  /* 单列带内不做首滑动画，避免滑动时卡顿 */
  .metric { animation: none !important; }
  .metric .label {
    font-size: 12.5px;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: keep-all;
    min-height: 0;
    text-align: left;
  }
  .metric .value {
    font-size: 30px;
    margin: 7px 0 6px;
    text-align: left;
    line-height: 1.12;
  }
  .metric .value span { font-size: 13px !important; }
  .metric .delta-up, .metric .delta-down, .metric .delta-flat {
    font-size: 12px;
    line-height: 1.5;
    word-break: keep-all;
    text-align: left;
  }
  .metric .price { font-size: 20px; }
  /* 滑动提示：「↔ 左右滑动」细标签，纯装饰不加内容字 */
  .metric-row::after,
  #metricRow.metric-row::after {
    content: "";
    flex: 0 0 2px;
  }
}
/* 极窄屏：卡片略窄一点，保证一屏能看到 1.5 张 */
@media (max-width: 400px) {
  .metric-row > .metric,
  #metricRow.metric-row > .metric {
    width: 74vw;
    min-width: 74vw;
    padding: 14px 14px 15px;
  }
  .metric .value { font-size: 27px; }
}

/* 产品矩阵价格卡：窄屏两列，不再硬塞 N 列
   ⚠️ B 档（2026-11-06 22:2x）已改为单列通栏，见文件末尾「B 档细化」 */
@media (max-width: 860px) {
  .price-row {
    grid-template-columns: repeat(auto-fit, minmax(min(46%, 160px), 1fr)) !important;
    gap: 10px;
  }
}

/* ---------- 4. 图表高度：手机上压缩，避免一屏一图 ---------- */
@media (max-width: 860px) {
  .chart-wrap, .chart-wrap.tall { height: 300px; }
  .chart-wrap.short { height: 230px; }
  /* 雷达图标签在窄屏要留足外圈空间 */
  #overview .chart-wrap.tall { height: 330px; }
}
@media (max-width: 400px) {
  .chart-wrap, .chart-wrap.tall { height: 270px; }
  .chart-wrap.short { height: 210px; }
}

/* ---------- 5. 表格：窄屏转「卡片式」竖排（治横向溢出） ----------
   桌面保留真表格（陛下已验收）；≤860px 用 data-label 逐行变卡片。
   注意：需 render.js 给每个 td 打 data-label（取 thead 列名）。 */
@media (max-width: 860px) {
  .table-wrap {
    border: none;
    overflow-x: visible;
    margin-top: 10px;
    border-radius: 0;
  }
  .brand-table,
  .brand-table tbody,
  .brand-table tr,
  .brand-table td {
    display: block;
    width: auto !important;
    min-width: 0 !important;
    max-width: 100%;
  }
  .brand-table { min-width: 0 !important; border-collapse: separate; }
  .brand-table thead { display: none; }

  .brand-table tbody tr {
    background: rgba(13, 24, 44, 0.62);
    border: 1px solid var(--border);
    border-left: 3px solid rgba(79, 195, 247, 0.55);
    border-radius: 12px;
    padding: 4px 12px;
    margin-bottom: 10px;
  }
  .brand-table tbody tr:hover { background: rgba(13, 24, 44, 0.62); }

  .brand-table tbody td {
    display: grid;
    grid-template-columns: 74px 1fr;
    gap: 10px;
    align-items: start;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(130, 160, 200, 0.13);
    font-size: 13.5px;
    line-height: 1.65;
    white-space: normal !important;
    word-break: normal;
    overflow-wrap: anywhere;
    /* 覆盖桌面的首列定宽 / 短文本 nowrap */
    min-width: 0 !important;
    width: auto !important;
  }
  .brand-table tbody td:last-child { border-bottom: none; }
  .brand-table tbody td.cell-nowrap { white-space: normal !important; }

  /* 列名标签 */
  .brand-table tbody td::before {
    content: attr(data-label);
    color: var(--text-dim);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    line-height: 1.85;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 首列（主体名）作为卡片标题：整行通栏、亮色、加大 */
  .brand-table tbody td:first-child {
    display: block;
    padding: 9px 0 8px;
    margin-bottom: 2px;
    border-bottom: 1px solid rgba(130, 160, 200, 0.2);
    font-size: 14.5px;
    font-weight: 700;
    color: #cdeaff;
    line-height: 1.5;
  }
  /* 首列若本身带列名（如"指标/主体"），用标签小字挂在上面 */
  .brand-table tbody td:first-child::before {
    display: block;
    content: attr(data-label);
    color: var(--text-dim);
    font-size: 10.5px;
    font-weight: 600;
    margin-bottom: 1px;
  }
  /* 表格内的标签不竖排 */
  .brand-table td .tag { white-space: nowrap; }
}

/* ---------- 6. 时间轴：窄屏改两列 ---------- */
@media (max-width: 860px) {
  .timeline { gap: 10px; margin-top: 12px; }
  .tl-node { min-width: calc(50% - 5px); flex: 1 1 calc(50% - 5px); padding: 14px 8px 12px; }
  .tl-label { font-size: 12px; }
  .tl-date { font-size: 14px; margin: 4px 0 6px; }
  .tl-tag { font-size: 10.5px; padding: 1px 8px; }
}

/* ---------- 7. 优化方案 / 语音播报 / Persona ---------- */
@media (max-width: 860px) {
  .plan-body { gap: 12px; }
  .plan-phase { padding: 13px 13px; }
  .plan-phase-head h3 { font-size: 14.5px; min-width: 0; }
  .plan-item { padding: 9px 10px; }
  .plan-item-t { font-size: 13.5px; }
  .plan-item-d { font-size: 12.5px; }
  .voice-btn { min-height: 44px; font-size: 14px; padding: 11px 18px; }
  .voice-script p { font-size: 14px; line-height: 1.75; }
  /* Persona 名称列改窄，值列留足 */
  #user .split-3 .score-row { grid-template-columns: 66px 1fr; gap: 8px; }
  #user .split-3 .score-row .name { width: 66px; min-width: 66px; font-size: 12.5px; }
  #user .split-3 .score-row .num { font-size: 13px; }
  .score-row { font-size: 13.5px; gap: 8px; margin: 8px 0; }
  .score-row .num { font-size: 14px; }
  .stat-list .name { font-size: 13px; }
  .stat-list .num { font-size: 13px; }
}

/* 极窄屏（≤400px）：评分条两侧再收一点 */
@media (max-width: 400px) {
  .score-row .name { font-size: 13px; }
  .score-bar { height: 8px; }
}

/* ---------- 8. 页脚与回顶按钮 ---------- */
@media (max-width: 860px) {
  .footer { padding: 24px 16px; font-size: 11.5px; line-height: 1.85; }
  .back-top { right: 14px; bottom: 16px; width: 44px; height: 44px; }
}

/* ---------- 9. 手机横屏（宽度可能 >860px）：按移动端处理，防止回到桌面版式 ----------
   常见：844×390（iPhone 横放）。这类尺寸 >860? 否（844），但 926×428 / 932×430 会漏。
   故额外用「高度 ≤ 500px 的触屏」判定。 */
/* 防回退守卫 ①：所有 ≤1100px 一律走两列，杜绝 4 列压成单字竖排 */
@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 960px) and (max-height: 500px) and (orientation: landscape) {
  .metric-row,
  #metricRow.metric-row {
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 10px;
  }
  .grid-4 { grid-template-columns: repeat(3, 1fr) !important; }
  .container { padding: 10px 12px 20px; }
  .card { padding: 14px 14px; margin-bottom: 12px; }
  .section-nav { max-height: 80vh; }
}

/* 防回退守卫 ②：≤1000px 时导航胶囊允许换行居中对齐（10 项铺不下）
   实测：932×430 横屏下 flex-wrap:nowrap 把导航顶到 992px → 横向溢出 */
@media (max-width: 1000px) {
  .section-nav {
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 10px;
  }
}
/* 防回退守卫 ③：≤1000px 表格仍用「可横滑容器」兜底（桌面 min-width 不撤，但外层可滚） */
@media (max-width: 1000px) {
  .table-wrap { max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
}
/* 防回退守卫 ④：≤1280px 优化方案卡由两列收成单列。
   实测：Pro 竖屏（1180）下两列各 559px，累计比容器多 1px → 文档横向溢出。
   1280 以下单列既免溢出，也更好读（此区间本就窄）。 */
@media (max-width: 1280px) {
  .plan-body { grid-template-columns: 1fr; }
  .container { max-width: 100%; }
  .table-wrap { max-width: 100%; }
}

/* ---------- 10. 横屏矮屏（手机横放）：压掉粘性顶栏高度 ---------- */
@media (max-width: 900px) and (orientation: landscape) and (max-height: 480px) {
  .topbar { padding: 6px 14px; }
  .chart-wrap, .chart-wrap.tall { height: 240px; }
}

/* ---------- 10. 优化方案：窄屏解除 min-width:200px 造成的横向溢出 ----------
   实测：桌面段 `.plan-phase-head h3 { flex:1 1 auto; min-width:200px }` +
   `.plan-goal { white-space:nowrap }` 在 390px 卡里叠加超标 → 计划卡被顶到 549px 宽。
   处置：窄屏 h3 允许收缩、goal 徽章允许折行。 */
/* 优化方案卡：≤1100px（含平板/手机横放）都要解除桌面 min-width，否则卡片被顶宽 */
@media (max-width: 1100px) {
  .plan-body, .plan-phase, .plan-phase-head, .plan-actions, .plan-item {
    min-width: 0;
    max-width: 100%;
  }
  .plan-phase-head h3 { min-width: 0; }
  .plan-goal { white-space: normal; max-width: 100%; }
}
@media (max-width: 860px) {
  .plan-body, .plan-phase, .plan-phase-head, .plan-actions, .plan-item {
    min-width: 0;
    max-width: 100%;
  }
  .plan-phase-head h3 { min-width: 0; flex: 1 1 100%; }
  .plan-goal {
    white-space: normal;
    flex: 0 1 auto;
    max-width: 100%;
    font-size: 12px;
    line-height: 1.5;
  }
  .plan-item-t { word-break: normal; overflow-wrap: anywhere; }
}

/* ============================================================
   平板 / 小笔记本守卫（861–1100px）
   ------------------------------------------------------------------
   实测：1024×768 与 932×430（手机横放）仍走桌面版式，出现两处撑破：
     · 导航 10 个胶囊 flex-wrap:nowrap → 右侧溢出（1024 屏 nav 伸到 1121px）
     · 表格 min-width:720 + 首列 230 → 表格 1033px，比容器宽
   处置：此区间导航一律换行居中；表格保留横滑但外层加圆角提示。
   ============================================================ */
@media (max-width: 1100px) {
  .section-nav {
    flex-wrap: wrap !important;
    justify-content: center !important;
    gap: 8px 10px !important;
  }
  .section-nav a { flex: 0 1 auto; padding: 8px 14px; }
  /* 861–1100px（平板/手机横放）也把表格切成卡片：
     桌面 min-width:720 + 首列 230 在 1024 屏下算出 1033px，比容器宽 → 整页被顶出屏幕
     （仅靠 .table-wrap 横滑不能阻止 document 溢出）。 */
  .table-wrap { border: none; overflow-x: visible; margin-top: 10px; border-radius: 0; background: none; }
  .brand-table,
  .brand-table tbody,
  .brand-table tr,
  .brand-table td { display: block; width: auto !important; min-width: 0 !important; max-width: 100%; }
  .brand-table { min-width: 0 !important; border-collapse: separate; }
  .brand-table thead { display: none; }
  .brand-table tbody tr {
    background: rgba(13, 24, 44, 0.62);
    border: 1px solid var(--border);
    border-left: 3px solid rgba(79, 195, 247, 0.55);
    border-radius: 12px;
    padding: 4px 12px;
    margin-bottom: 10px;
  }
  .brand-table tbody td {
    display: grid;
    grid-template-columns: 84px 1fr;
    gap: 10px;
    align-items: start;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(130, 160, 200, 0.13);
    font-size: 13.5px;
    line-height: 1.65;
    white-space: normal !important;
    word-break: normal;
    overflow-wrap: anywhere;
  }
  .brand-table tbody td:last-child { border-bottom: none; }
  .brand-table tbody td.cell-nowrap { white-space: normal !important; }
  .brand-table tbody td::before {
    content: attr(data-label);
    color: var(--text-dim);
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.85;
    white-space: nowrap;
  }
  .brand-table tbody td:first-child {
    display: block;
    padding: 9px 0 8px;
    margin-bottom: 2px;
    border-bottom: 1px solid rgba(130, 160, 200, 0.2);
    font-size: 14.5px;
    font-weight: 700;
    color: #cdeaff;
  }
  .brand-table tbody td:first-child::before {
    display: block;
    content: attr(data-label);
    color: var(--text-dim);
    font-size: 10.5px;
    font-weight: 600;
  }
  /* 横滑提示：右侧渐隐，告诉用户「还能往右拖」 */
  .table-wrap {
    position: relative;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background:
      linear-gradient(90deg, rgba(13,21,38,0.9) 0%, rgba(13,21,38,0) 12px) left / 24px 100% no-repeat local,
      linear-gradient(270deg, rgba(13,21,38,0.9) 0%, rgba(13,21,38,0) 12px) right / 24px 100% no-repeat local;
  }
  .metric-row, #metricRow.metric-row { gap: 14px; }
  .metric .value { font-size: 32px; }
}

/* ============================================================
   B 档细化层（2026-11-06 · 照本堂移动端可读性重排）
   基调：不动文案、不动桌面版式，仅 ≤860px 生效
   目标：价格卡由 2×2 挤压 → 单列通栏；三层信息分离；
        编码串/数字单位不拆行；孤立标点修正；语音稿加层级
   ============================================================ */

@media (max-width: 860px) {

  /* ---------- B1. 价格卡：横滑单列带（C 档 2026-11-07 陛下旨意） ----------
     原：2×2 挤压 → 曾改单列通栏 → 现改「横向可滑动」。
     每卡 76vw，内部仍是三层：品类名 → 价格 → 说明，竖排完整不被砍。 */
  #business .price-row,
  .price-row {
    display: flex !important;
    flex-wrap: nowrap !important;
    grid-template-columns: none !important;
    gap: 12px !important;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    padding: 2px 2px 12px;
    margin: 10px -2px 0;
    scrollbar-width: none;
  }
  #business .price-row::-webkit-scrollbar,
  .price-row::-webkit-scrollbar { height: 0; display: none; }

  #business .price-row .metric,
  .price-row .metric {
    flex: 0 0 auto;
    scroll-snap-align: start;
    width: 76vw;
    min-width: 76vw;
    max-width: 320px;
    text-align: left;
    padding: 15px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: none !important;
  }
  /* 第一层：品类名（小字灰蓝） */
  #business .price-row .metric .label {
    flex: 0 0 auto;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--text-dim);
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 第二层：价格（大号，独立一行，不挤） */
  #business .price-row .metric .price {
    flex: 0 0 auto;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.15;
    white-space: nowrap;
    letter-spacing: 0.2px;
    text-align: left;
  }
  /* 第三层：说明（左对齐、行高放开） */
  #business .price-row .metric .delta-flat {
    flex: 1 1 auto;
    text-align: left;
    font-size: 12.5px;
    line-height: 1.75;
    color: #a9b8cc;
    word-break: normal;
    overflow-wrap: anywhere;
    line-break: strict;
    hanging-punctuation: allow-end;
    padding-top: 8px;
    border-top: 1px dashed rgba(130, 160, 200, 0.22);
  }

  /* ---------- B2. 编码串 / 数字+单位：整块不拆 ----------
     例：W12997 398 / W13018 478 / W22775 468（419 券后）
     目标：数字与单位（㎡、元、万、%）、字母编码与价格各自成块，不被动拆行 */
  #business .price-row .metric .delta-flat,
  #business .price-row .metric .price {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  /* 用零宽不换行连接常见的「数字+单位」组合：由 render 层插入 <span class="nb"> */

  /* ---------- B3. 首屏「价格带错位」通栏卡：数字与其余四卡对齐 ---------- */
  #metricRow .metric .value {
    letter-spacing: 0.3px;
  }
  #metricRow > .metric:last-child:nth-child(odd) .value {
    font-size: 32px;
    line-height: 1.12;
  }
  #metricRow > .metric:last-child:nth-child(odd) .delta-flat {
    font-size: 13px;
    line-height: 1.6;
  }

  /* ---------- B4. 竞品表：标签列统一宽度右对齐 ---------- */
  .brand-table tbody td .tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 92px;
    min-height: 26px;
    padding: 3px 10px;
    line-height: 1.2;
  }

  /* ---------- B5. 语音播报稿：加呼吸与小结层级 ---------- */
  .voice-script {
    gap: 13px;
  }
  .voice-script p {
    font-size: 14px;
    line-height: 1.85;
    padding-left: 13px;
    border-left-width: 3px;
  }
  /* 段内加粗小结（render 层用 <strong> 标出，文字未改） */
  .voice-script p strong {
    color: #e8f3ff;
    font-weight: 700;
    /* 用极淡底衬把关键句拎出来，不靠换字 */
    background: linear-gradient(180deg, transparent 62%, rgba(79, 195, 247, 0.16) 62%);
    padding: 0 1px;
  }
  /* 段首编号点：视觉切分，不加字 */
  .voice-script p {
    position: relative;
  }

  /* ---------- B6. 柱状图：0 值柱给虚线基准，避免「像没加载」 ---------- */
  /* 由 render 层在 chart 配置里加 minBarLength + 0 值描边，此处只调标签密度 */
  .chart-wrap canvas {
    max-width: 100%;
  }
}

@media (max-width: 400px) {
  #business .price-row .metric,
  .price-row .metric {
    width: 78vw;
    min-width: 78vw;
    padding: 14px 14px 15px;
  }
  #business .price-row .metric .price {
    font-size: 22px;
  }
  #business .price-row .metric .delta-flat {
    font-size: 12px;
    line-height: 1.72;
  }
  .brand-table tbody td .tag {
    min-width: 84px;
  }
}

/* B 档：不可拆块（数字+单位、编码+价格）——桌面与窄屏通用，纯排版 */
.nb {
  white-space: nowrap;
  word-break: keep-all;
}

/* ============================================================
   渲染缺陷全局修复 · 2026-11-07
   症状：滚动时偶发黑色长方块遮挡，再滚又消失。
   根因：backdrop-filter(毛玻璃) + background-attachment:fixed
        + body::before(position:fixed 固定纹理) 三者叠加，
        浏览器合成层在滚动中偶发失效 → 出现纯黑矩形。
   处置：三者全部取消，毛玻璃改为接近不透明的实底（观感一致）。
   ============================================================ */
* { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
body { background-attachment: scroll !important; }
body::before { position: absolute !important; inset: 0 !important; height: 100% !important; }

/* ---------- 修 2：正文对比度（深色底上提亮次级文字） ---------- */
:root {
  --card: rgba(21, 33, 55, 0.96);
  --card-hover: rgba(31, 47, 76, 0.98);
  --text: #eef4fd;
  --text-muted: #b9c8dc;   /* 原 #93a4bc → 提亮，正文/说明不再发暗 */
  --text-dim: #8b9db6;     /* 原 #5f7290 → 提亮，仍保留层级差 */
  --border: rgba(150, 178, 214, 0.20);
  --border-strong: rgba(150, 178, 214, 0.36);
}

/* ---------- 修 3：吸底导航（2026-11-18 起默认关闭，见文件末尾「底部导航条默认关闭」）----------
   保留原 96/88px 预留仅对旧页面（data.js 未写 meta.bottomDock 且已生成的历史页）无意义，
   现统一由「有 .bottom-dock 才留白」控制，此处不再强制。 */

.bottom-dock {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 1200;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 12px calc(9px + env(safe-area-inset-bottom, 0px));
  background: rgba(10, 16, 28, 0.985);
  border-top: 1px solid var(--border-strong);
  box-shadow: 0 -12px 30px -14px rgba(0, 0, 0, 0.9);
  overflow-x: auto;
  scrollbar-width: none;
}
.bottom-dock::-webkit-scrollbar { height: 0; display: none; }
.bottom-dock a {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 10px 15px;
  border-radius: 22px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-muted);
  text-decoration: none;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.04);
  white-space: nowrap;
  transition: all 0.2s ease;
}
.bottom-dock a:hover { color: var(--text); border-color: var(--border-strong); }
.bottom-dock a.active {
  color: #06121f;
  background: var(--primary);
  border-color: transparent;
  font-weight: 700;
}
.bottom-dock .ic { width: 14px; height: 14px; }
@media (min-width: 861px) { .bottom-dock { justify-content: center; } }

/* ============================================================
   板块导航「吸顶」修复 · 2026-11-07 18:0x
   陛下原话：「导航始终没解决，不会随着上下滚动」
   → 语义 = 要的是「导航固定在视口、内容在其下滚动」。
   原 .section-nav 只是普通流内元素（display:flex），
   滚过之后就被甩到屏幕上去了，所以看起来"没固定"。
   现改为 position: sticky 吸顶，并处理：
     ① 顶栏 .topbar 自身也是 fixed/sticky，需要给导航让出顶栏高度
     ② 窄屏（≤860px）原本把 .section-nav 变下拉面板，
        sticky 会与 absolute 面板冲突 → 窄屏仍走上拉开合，不吸顶
     ③ 吸顶后加底色 + 边框 + 阴影，避免内容从下方透上来
   ============================================================ */
@media (min-width: 861px) {
  .section-nav {
    position: sticky;
    top: 79px;   /* 让出 fixed 顶栏高度，由 render.js 动态校正 */
    z-index: 850;
    /* 吸顶后需要不透明底，否则正文从下面透上来 */
    background: linear-gradient(180deg, rgba(10, 16, 28, 0.985), rgba(10, 16, 28, 0.96));
    padding: 10px 12px;
    margin-left: -12px;
    margin-right: -12px;
    border-bottom: 1px solid var(--border-strong);
    box-shadow: 0 10px 26px -18px rgba(0, 0, 0, 0.9);
    border-radius: 0 0 14px 14px;
    transition: box-shadow 0.22s ease, background 0.22s ease;
  }
  /* 吸顶生效（离开原位）时加深阴影，给出"浮起"的视觉提示 */
  .section-nav.is-stuck {
    box-shadow: 0 14px 34px -16px rgba(0, 0, 0, 0.95);
  }
  /* 锚点跳转时不要让标题被吸顶导航压住 */
  html { scroll-padding-top: 150px; }
}
/* 窄屏：保持原有「总览 ▾」上拉抽屉，不吸顶（否则与下拉面板冲突） */
@media (max-width: 860px) {
  .section-nav { position: absolute !important; top: calc(100% + 8px) !important; }
}

/* ---------- 吸顶导航与顶栏的层叠关系（2026-11-07 18:0x）----------
   顶栏 .topbar 是 position:sticky (z-index:100)，高度 79px。
   .section-nav 吸顶后 z-index:850 > 100，会盖住顶栏。
   处置：导航吸顶位置 = 顶栏高度（79px），两者上下紧贴不重叠；
        同时把顶栏 z-index 提到 860，保证顶栏始终在最上层，
        导航在其下方滑过时不会遮挡标题栏。 */
@media (min-width: 861px) {
  .topbar { z-index: 860; }
  .section-nav { z-index: 850; }
}

/* ============================================================
   顶部导航 · 单行自适应（模板级，2026-11-07 20:0x）
   陛下要求：顶部导航显示为 1 横行。
   问题：各客户板块名长短不一（9~10 个胶囊，最长 18 字），
         fixed 字号必然折行或溢出。
   解法：① 一律 nowrap 单行  ② 字号/内距用 clamp 随视口缩放
         ③ 溢出兜底：横向滚动（不可见滚动条），绝不打折行
   ============================================================ */
@media (min-width: 861px) {
  .section-nav {
    flex-wrap: nowrap !important;
    justify-content: space-between !important;
    gap: clamp(3px, 0.55vw, 8px) !important;
    padding: 10px clamp(6px, 0.8vw, 12px) !important;
    width: 100% !important;
    box-sizing: border-box !important;
    overflow-x: auto !important;
    overflow-y: visible !important;
    scrollbar-width: none;
  }
  .section-nav::-webkit-scrollbar { height: 0; display: none; }
  .section-nav a {
    flex: 0 0 auto !important;
    white-space: nowrap !important;
    padding: 9px clamp(6px, 0.75vw, 15px) !important;
    font-size: clamp(12px, 0.92vw, 14px) !important;
    gap: clamp(3px, 0.35vw, 6px) !important;
  }
  .section-nav a .ic { flex: 0 0 auto; width: clamp(11px, 0.9vw, 14px) !important; height: clamp(11px, 0.9vw, 14px) !important; }
}

/* 二次收口：让 10 个胶囊在 1440 内真正排下（不留横滚） */
@media (min-width: 861px) {
  .section-nav { gap: clamp(2px, 0.38vw, 6px) !important; padding: 10px clamp(5px, 0.6vw, 9px) !important; }
  .section-nav a {
    padding: 9px clamp(5px, 0.6vw, 11px) !important;
    font-size: clamp(11.5px, 0.82vw, 13.5px) !important;
    letter-spacing: -0.15px !important;
    gap: clamp(2px, 0.28vw, 5px) !important;
  }
  .section-nav a .ic { width: clamp(10px, 0.8vw, 13px) !important; height: clamp(10px, 0.8vw, 13px) !important; }
}

/* 双标签互斥（模板级）：原本只覆盖了 wangyifu 主题，其余客户两段同时显示 */
@media (min-width: 861px) {
  .section-nav a .lbl-full { display: none !important; }
  .section-nav a .lbl-short { display: inline !important; }
}
@media (max-width: 860px) {
  .section-nav a .lbl-full { display: inline !important; }
  .section-nav a .lbl-short { display: none !important; }
}

/* 字号下限提回 13px（短标最长 4 字，有足够余量） */
@media (min-width: 861px) {
  .section-nav { gap: clamp(3px, 0.5vw, 9px) !important; padding: 10px clamp(6px, 0.7vw, 12px) !important; }
  .section-nav a {
    padding: 9px clamp(7px, 0.85vw, 17px) !important;
    font-size: clamp(13px, 0.95vw, 14px) !important;
    letter-spacing: 0 !important;
    gap: clamp(3px, 0.35vw, 6px) !important;
  }
  .section-nav a .ic { width: clamp(12px, 0.9vw, 14px) !important; height: clamp(12px, 0.9vw, 14px) !important; }
}

/* 吸顶导航底色改全实心：渐变带 0.96 透明度仍会透出正文（2026-11-07 20:1x） */
@media (min-width: 861px) {
  .section-nav,
  .section-nav.is-stuck {
    background: #0d1526 !important;
    background-image: none !important;
  }
  .section-nav a { background: rgba(21, 33, 55, 0.98) !important; }
  .section-nav a.active { background: linear-gradient(135deg, #6fd1ff, #38a9e8 55%, #4dd0c4) !important; }
}

/* ============================================================
   四·五·六 三板块统一 3 行布局（2026-11-07 22:3x 陛下面谕）
   「456三部分，要么一行，要么三行」→ 统一取「三行」：
     四·合作模式  A/B/C 三种（原 4 条 → 归并为 3 条）
     五·推进路径  三阶段横向 3 列，每列纵列其项（原 4 阶段纵向 4 行）
     六·守的规矩  五条 → 上 3 条一行 + 下 2 条一行（共 2 行不好）→ 3 列 × 2 行
   统一规则：≥720px 一律 3 列（方案一 · 2026-11-07 23:4x 钦定）；＜720px 回落 1 列
   ============================================================ */
@media (min-width: 720px) {
  /* 五·推进路径：3 阶段横排 */
  #path .plan-body {
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 14px !important;
  }
  /* 每阶段内部条目改纵列（3 列太窄，横排会挤） */
  #path .plan-actions {
    grid-template-columns: 1fr !important;
    gap: 8px !important;
  }

  /* 六·守的规矩：3 列 × 2 行 */
  #promise .sec-body > .stat-list,
  #promise .sec-body > .score-rows {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 10px 16px !important;
  }
  /* 若为散排 score-row，用 flex 容器兜底 */
  #promise .sec-body > .score-row {
    display: flex;
  }
}
/* 手机回落 */
@media (max-width: 719px) {
  #path .plan-body { grid-template-columns: 1fr !important; }
  #path .plan-actions { grid-template-columns: 1fr !important; }
}

/* 六·守的规矩：三条改 3 列同排（原为纵向 3 行）——与四·五 板块取同一视觉语言 */
@media (min-width: 720px) {
  #promise .sec-body {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 12px 18px !important;
    align-items: start;
  }
  #promise .sec-body > .score-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    margin: 0;
    padding: 12px 14px;
    background: rgba(212, 175, 106, 0.05);
    border: 1px solid rgba(212, 175, 106, 0.16);
    border-radius: 10px;
  }
  #promise .sec-body > .score-row .name {
    width: auto !important;
    flex: 0 0 auto;
    font-size: 14px;
    line-height: 1.6;
    white-space: normal;
  }
  #promise .sec-body > .score-row .score-bar { width: 100%; flex: 0 0 auto; margin: 0 !important; }
  #promise .sec-body > .score-row .num { font-size: 13px; }
  /* good 文字块跨满整行 */
  #promise .sec-body > .split-2,
  #promise .sec-body > p,
  #promise .sec-body > .stat-foot {
    grid-column: 1 / -1;
  }
}

/* ============================================================
   底部导航条默认关闭（2026-11-18 陛下旨意：不需要）
   render.js 已按 meta.bottomDock 决定是否创建；此处再兜一层：
   若页面里没有 .bottom-dock 元素，正文底部的 84px 让位内边距一并取消。
   ============================================================ */
body:not(:has(.bottom-dock)) { padding-bottom: 0 !important; }
/* 特异性要比 1798/1799 行那两条 !important 更高，故再补一条 id/class 组合 */
html body:not(:has(.bottom-dock)):not(:has(#bottomDock)) { padding-bottom: 0 !important; }

<script>
/* ============================================================

(function () {
  "use strict";
  if (!window.DASH) { console.error("未找到 window.DASH 数据，请先引入对应 data.js"); return; }
  const D = window.DASH;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s);
  const isNarrow = () => (window.innerWidth || 1024) <= 860;

  /* ---------- 页面头部（标题/客户/阶段） ---------- */
  function renderHead() {
    const m = D.meta || {};
    const ttls = D.titles || {};
    const titleEl = document.querySelector(".topbar h1");
    if (titleEl) titleEl.innerHTML = icon("rocket", "ic") + '<span class="grad">' + esc(m.brand || "") + " · " + esc(m.doc_title || "品牌诊断系统") + "</span>";
    const clientEl = document.querySelector(".head-client");
    if (clientEl) clientEl.textContent = "客户：" + esc(m.client_name || "");

    if (metaEl) metaEl.innerHTML = '<span class="chip">' + esc(m.stage_label || "") + "</span>" + (m.stage_date ? "<span> | " + esc(m.stage_date) + "</span>" : "");
    // 各区块标题
    setChartTitle("radar", ttls.radar || D.radar && D.radar.title || "📡 6 大板块雷达对比");
    setChartTitle("bar28", ttls.bar28 || "📊 28 模块评分明细");
    setChartTitle("timeline", ttls.timeline || "📅 调研节点规划");
    document.title = (m.brand || "") + " · " + (m.doc_title || "品牌诊断系统");
  }
  function setChartTitle(id, txt) {
    const el = document.querySelector('.chart-title[data-title-for="' + id + '"]');
    if (el) el.innerHTML = icon(id === "timeline" ? "calendar" : id === "radar" ? "radar" : "chart", "ic") + " " + esc(txt);
  }

  /* ---------- 移动端章节抽屉（≤860px 时导航收进顶栏按钮，避免胶囊换行堆叠） ---------- */
  function setupNavDrawer() {
    var nav = $("navLinks");
    var bar = document.querySelector(".topbar");
    if (!nav || !bar || bar.querySelector(".nav-toggle")) return;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "nav-toggle";
    btn.setAttribute("aria-label", "展开章节导航");
    btn.setAttribute("aria-expanded", "false");
    btn.innerHTML = icon("grid", "ic") + '<span class="nav-toggle-t">章节</span>' +
      '<svg class="nav-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
    bar.appendChild(btn);

    var backdrop = document.createElement("div");
    backdrop.className = "nav-backdrop";
    document.body.appendChild(backdrop);


    function close() {
      nav.classList.remove("open");
      btn.classList.remove("open");
      backdrop.classList.remove("show");
      btn.setAttribute("aria-expanded", "false");
    }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var willOpen = !nav.classList.contains("open");
      if (willOpen) positionNav();
      nav.classList.toggle("open", willOpen);
      btn.classList.toggle("open", willOpen);
      backdrop.classList.toggle("show", willOpen);
      btn.setAttribute("aria-expanded", willOpen ? "true" : "false");
    });
    // 面板定位：sticky 的 .topbar 是定位祖先但高度仅 ~117px，
    // absolute 面板会被裁掉/滚到页面顶端 → 统一用 fixed + 实测坐标贴顶栏下沿。
    //
    // 🔴 2026-11-07 18:0x 关键修复：
    //   这段原先在初始化时就跑 positionNav()，把内联 style 写成
    //   position:fixed; top:79px; left:12px; right:12px，**永久覆盖**了
    //   CSS 里的 position:sticky → 顶部板块导航因此永远不吸顶。
    //   现改为：只在窄屏（走抽屉）时套用；宽屏清空内联样式，交回 sticky。
    function positionNav() {
      if (window.innerWidth > 860) {
        // 宽屏：导航是吸顶条，不能有内联 fixed 覆盖
        nav.style.position = "";
        nav.style.top = "";
        nav.style.left = "";
        nav.style.right = "";
        return;
      }
      var rect = bar.getBoundingClientRect();
      nav.style.position = "fixed";
      nav.style.top = Math.round(rect.bottom + 8) + "px";
      nav.style.left = "12px";
      nav.style.right = "12px";
    }
    positionNav();
    window.addEventListener("resize", positionNav, { passive: true });
    window.addEventListener("scroll", function () {
      if (nav.classList.contains("open")) close();
      // 宽屏兜底：若被别处写成 fixed，滚回顶部时清掉
      if (window.innerWidth > 860 && nav.style.position === "fixed" && !nav.classList.contains("open")) {
        nav.style.position = ""; nav.style.top = ""; nav.style.left = ""; nav.style.right = "";
      }
    }, { passive: true });

    backdrop.addEventListener("click", close);
    nav.addEventListener("click", function (e) { if (e.target.closest("a")) close(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  }

  /* ---------- 顶部导航锚点（总览 + 六板块 + 语音/方案/时间轴，数据驱动） ---------- */
  function renderNav() {
    // 导航顺序严格对齐「页面正文实际顺序」（2026-11-06 修订）
    // 正文顺序：总览 → 六大板块 → 语音播报 → 优化方案 → 节点规划
    //   （早前版本把 voice/plan 提到 sections 之前，导致导航与正文不一致）
    const items = [];
    // 短标签表（2026-11-07 19:5x）：窄屏用短标，保证顶部导航始终 1 行且字号可读
    // 导航一律用短标（正文标题不受影响）——2026-11-07 19:5x 陛下要求「1 横行」
    const SHORT_LABEL = {
      // —— 诊断页（六层模型）——
      overview: "总览", strategy: "战略", market: "市场", competition: "竞品",
      user: "用户", asset: "资产", business: "商业",
      sample: "样本", evidence: "证据", geo: "GEO",
      // —— 方案页 ——
      svc1: "基础工程", svc2: "当代传播", modes: "合作模式",
      path: "推进路径", promise: "守的规矩",
      voice: "语音", plan: "方案", timeline: "节点"
    };
    items.push(["overview", "grid", "总览"]);
    var order = D.sectionOrder && D.sectionOrder.length ? D.sectionOrder : (D.sections || []).map(function (s) { return s.id; });
    (order || []).forEach(function (id) {
      var sec = (D.sections || []).filter(function (s) { return s.id === id; })[0];
      if (!sec || !sec.name) return;
      items.push([sec.id, sec.icon || "chart", sec.name]);
    });
    if (D.voice && (D.voice.script || D.voice.audio)) items.push(["voice", "mic", "语音播报"]);
    if (D.plan && (D.plan.phases || D.plan.script)) items.push(["plan", "bulb", "优化方案"]);
    if ((D.timeline || []).length) items.push(["timeline", "calendar", "节点规划"]);
    // 去重（防重复 id）
    var seen = {};
    var navArr = items.filter(function (it) { if (seen[it[0]]) return false; seen[it[0]] = 1; return true; });
    if (!navArr.length) { navArr = [["overview", "grid", "总览"]]; }
    $("navLinks").innerHTML = navArr.map(function (d, i) {
      // 长标 → 主标(+ 副标)：副标放进 .lbl-sub，窄屏由 CSS 隐去，
      // 保证导航永远 1 行且字号不缩小（2026-11-07 19:5x）
      var full = String(d[2] || "");
      var main = full, sub = "";
      var cut = full.indexOf("·");
      if (cut > 0) { main = full.slice(0, cut).trim(); sub = full.slice(cut + 1).trim(); }
      var shortLbl = SHORT_LABEL[d[0]] || main;   // 短标优先
      var html = icon(d[1], "ic")
        + '<span class="lbl-full">' + esc(main)
        + (sub ? '<span class="lbl-sub">· ' + esc(sub) + "</span>" : "") + "</span>"
        + '<span class="lbl-short">' + esc(shortLbl) + "</span>";
      return '<a href="#' + d[0] + '"' + (i === 0 ? ' class="active"' : "") + ">" + html + "</a>";
    }).join("");
    setupScrollSpy();
    setupNavDrawer();
  }

  /* ---------- 滚动高亮导航 ---------- */
  function setupScrollSpy() {
    var links = document.querySelectorAll("#navLinks a");
    var sections = Array.prototype.map.call(links, function (a) {
      return document.querySelector(a.getAttribute("href"));
    }).filter(Boolean);
    if (!sections.length) return;
    window.addEventListener("scroll", function () {
      var pos = window.scrollY + 120;
      var idx = 0;
      for (var i = 0; i < sections.length; i++) {
        if (sections[i].offsetTop <= pos) idx = i;
      }
      links.forEach(function (a, i) { a.classList.toggle("active", i === idx); });
    });
  }

  /* ---------- 顶部指标卡 ---------- */
  function renderMetrics() {
    const arr = (D.metrics || []).map(function (mm) {
      const mode = mm.deltaMode === "up" ? "delta-up" : mm.deltaMode === "down" ? "delta-down" : "delta-flat";
      const arrow = mm.deltaMode === "up" ? "▲" : mm.deltaMode === "down" ? "▼" : "";
      return '<div class="metric"><div class="label">' + esc(mm.label) +
        '</div><div class="value">' + esc(mm.value) + '<span style="font-size:16px;font-weight:600">' + esc(mm.sub || "") +
        '</span></div><div class="' + mode + '">' + arrow + " " + esc(mm.note || "") + "</div></div>";
    });
    $("metricRow").className = "grid metric-row";
    // 指标卡数量不定（4 个或 5 个）。
    // 🔴 2026-11-18 修复：原先只设 --metric-cols，但 CSS 从来没有消费这个变量
    // → #metricRow 保留 HTML 里的 .grid-4（4 列），第 5 张卡孤零零掉到第二行，
    //   而首行 4 张被拉成超宽矮条（实测序章 5 卡时严重错乱）。
    // 现在按实际数量显式写列数，并由 overrides/模板 CSS 用 minmax(0,1fr) 收口。
    $("metricRow").style.setProperty("--metric-cols", arr.length);
    // 仅宽屏生效；窄屏交给 CSS 的两列规则（用 !important 卡回，故内联不会污染移动端）
    if (arr.length > 0 && window.innerWidth > 860) {
      $("metricRow").style.gridTemplateColumns = "repeat(" + arr.length + ", minmax(0, 1fr))";
    }
    $("metricRow").innerHTML = arr.join("");
  }

  /* ---------- 雷达图（多序列对比） ---------- */
  function renderRadar() {
    if (!$("radarMain") || !D.radar) return;
    const r = D.radar;
    const TH = D.theme || {};
    const palette = TH.palette || ["#4fc3f7", "#66bb6a", "#ffa726", "#ab47bc", "#ef5350", "#ffd54f"];
    const fills = TH.paletteFill || ["rgba(79,195,247,0.15)"];
    var datasets = (r.series || []).map(function (s, i) {
      const c = palette[i % palette.length];
      return {
        label: s.label, data: s.data,
        borderColor: c, backgroundColor: fills[i % fills.length],
        borderWidth: 2, pointBackgroundColor: c, pointRadius: 4
      };
    });
    $("radarMain").getContext("2d");
    new Chart($("radarMain"), {
      type: "radar",
      data: { labels: r.axis, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          r: {
            beginAtZero: true, max: r.normalMax || 10,
            ticks: { stepSize: 2, color: TH.tick || "#8b9bb0", backdropColor: "transparent" },
            grid: { color: TH.grid || "rgba(255,255,255,0.1)" },
            angleLines: { color: TH.grid || "rgba(255,255,255,0.1)" },
            pointLabels: { color: TH.label || "#e0e6ed", font: { size: isNarrow() ? 11 : 12.5 } }
          }
        },
        plugins: { legend: { labels: { color: TH.legend || "#93a4bc", boxWidth: 12, font: { size: isNarrow() ? 11.5 : 12 } } } }
      }

  }

  /* ---------- 28 模块柱状图 ----------
     桌面：28 根竖柱一行铺满。
     手机（≤860px）：竖柱在 390px 里必挤成一团（标签重叠不可读），
     改为「横向条形图」——模块名在左、分数在右，纵向滚动最省力。
     数据顺序倒置，使得分最高的模块出现在最上方。 */
  function renderBar28() {
    if (!$("barModules") || !D.bar28) return;
    const B = D.bar28;
    const narrow = isNarrow();
    const labels = narrow ? B.labels.slice().reverse() : B.labels;
    const data = narrow ? B.data.slice().reverse() : B.data;
    const BT = D.theme || {};
    const cHi = BT.barHi || "#66bb6a", cMid = BT.barMid || "#4fc3f7", cLo = BT.barLo || "#ffa726";
    const colors = data.map(function (s) { return s >= 8 ? cHi : s >= 6 ? cMid : cLo; });

      type: "bar",
      data: {
        labels: labels,

          label: "得分",

      options: {
        responsive: true, maintainAspectRatio: false,
        indexAxis: narrow ? "y" : "x",
        layout: { padding: narrow ? { right: 6 } : 0 },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: BT.tipBg || "rgba(10,18,32,0.94)",
            borderColor: BT.tipBorder || "rgba(79,195,247,0.4)",
            borderWidth: 1,
            titleColor: BT.tipTitle || "#e8eef7",
            bodyColor: BT.tipBody || "#cdeaff",
            displayColors: false,
            callbacks: { label: function (c) { return "得分 " + c.parsed[narrow ? "x" : "y"] + " / 10"; } }
          }
        },
        scales: narrow ? {
          x: { beginAtZero: true, max: 10, ticks: { color: (D.theme&&D.theme.tick)||"#8b9bb0", font: { size: 10.5 }, stepSize: 2 }, grid: { color: "rgba(255,255,255,0.05)" } },
          y: { ticks: { color: (D.theme&&D.theme.label)||"#c3d0e0", font: { size: 11.5 }, autoSkip: false }, grid: { display: false } }
        } : {
          y: { beginAtZero: true, max: 10, ticks: { color: (D.theme&&D.theme.tick)||"#8b9bb0" }, grid: { color: (D.theme&&D.theme.grid)||"rgba(255,255,255,0.05)" } },
          x: { ticks: { color: (D.theme&&D.theme.tick)||"#8b9bb0", font: { size: 10.5, weight: "600" }, maxRotation: 62, minRotation: 45 }, grid: { display: false } }
        }
      }
    });
    // 窄屏时容器随模块数增高，避免 28 行挤在 300px 里
    if (narrow) {
      const wrap = $("barModules").closest(".chart-wrap");
      if (wrap) wrap.style.height = Math.max(320, data.length * 21 + 46) + "px";
    }
    return bar;
  }

  /* ---------- 通用：评分条 ---------- */
  function barsHtml(items, wide) {
    return items.map(function (it) {
      const name = Array.isArray(it) ? it[0] : it.name;
      const score = Array.isArray(it) ? it[1] : it.score;
      var cls = "fill" + (score >= 8 ? " hi" : score <= 5 ? " lo" : "");
      return '<div class="score-row"><span class="name">' + esc(name) +
        '</span><div class="score-bar" style="' + (wide ? "flex:2;margin:0 12px" : "flex:2;margin:0 12px") +
        '"><div class="' + cls + '" style="width:' + (score * 10) + '%"></div></div>' +
        '<span class="num">' + score + "</span></div>";
    }).join("");
  }

  /* ---------- 列表（亮点/缺口） ---------- */
  function listHtml(items) {
    return "<ul class=\"bullet\">" + items.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>";
  }

  /* ============ 渲染六大板块 ============ */
  const layout = {
    strategy: function (s) {
      let h = barsHtml(s.bars);
      const gsrc = s.group || (typeof D !== "undefined" ? D.group : null);
      if (gsrc) {
        const g = gsrc;
        h += "<h3>" + icon("users", "ic") + " 集团结构与关联主体</h3>";
        if (g.sub) h += '<p class="stat-foot">' + esc(g.sub) + "</p>";
        h += '<div class="table-wrap"><table class="brand-table"><thead><tr>' +
          "<th>主体</th><th>角色</th><th>状态</th><th>持股</th><th>说明</th></tr></thead><tbody>";
        (g.rows || []).forEach(function (r) {

  /* ---------- B 档：文本轻处理（不改字，只加标记） ----------
     ① wrapNB  ：把「数字+单位」「字母编码+价格」包成不拆块 <span class="nb">
     ② markKey ：语音稿每段挑一句关键句包 <strong>（原句原字，仅加粗）   */

  // 不可拆组合：30-80㎡ / 199-799 元 / 100% / 5-10 万 / W12997 398 / 419 券后
  const NB_RE = /((?:[A-Z]{1,3}\d{3,}\s*\d{3,})|(?:\d+(?:\.\d+)?(?:\s*[-~]\s*\d+(?:\.\d+)?)?\s*(?:㎡|m²|%|元|万|家|省|城|期|点|[A-Za-z]{1,2}\b)?))/g;

  function wrapNB(text) {
    return String(text == null ? "" : text).replace(NB_RE, function (m) {
      if (!m || !m.trim()) return m;
      return '<span class="nb">' + m + "</span>";
    });
  }

  // 语音稿：每段取「首句」或含结论词的那一句加粗（不加字、不改字、不删字）
  const KEY_HINT = /(一句话|必须说|最扎心|总结|建议先做|我也找到|还有一件事)/;
  function markKey(para) {
    const p = String(para == null ? "" : para);
    if (!p) return "";
    const parts = p.split(/(?<=[。！？])/);      // 按中文句末切句，保留标点
    if (!parts.length) return wrapNB(p);
    // 找到需要加粗的句子下标：优先含 KEY_HINT，否则取首句
    let idx = parts.findIndex(function (x) { return KEY_HINT.test(x); });
    if (idx < 0) idx = 0;
    return parts.map(function (x, i) {
      const body = wrapNB(x);
      return i === idx ? "<strong>" + body + "</strong>" : body;
    }).join("");
  }

  /* ---------- 语音播报卡（edge-tts 生成的 mp3 内嵌播放） ---------- */
  function renderVoice() {
    const v = D.voice;
    const el = $("voice");
    if (!el || !v) { if (el) el.style.display = "none"; return; }
    const tEl = el.querySelector(".chart-title");
    if (tEl) tEl.innerHTML = icon("mic", "ic") + " 语音播报";
    const subEl = el.querySelector(".voice-sub");
    if (subEl) subEl.innerHTML = esc(v.sub || "要点播报");
    const txtEl = el.querySelector(".voice-script");
    if (txtEl) txtEl.innerHTML = (v.script || []).map(function (p) { return "<p>" + markKey(p) + "</p>"; }).join("");
    // 音频资源：首屏渲染完成后即后台预下载，点播放时直接出声不卡
    const box = el.querySelector("#voiceAudio");
    const src = v.audio || "audio/voice.mp3";
    if (box && !box.getAttribute("src")) {
      box.setAttribute("src", src);
      box.setAttribute("preload", "auto");
      box.load();  // 立即开始下载整段音频
    }
    const btn = el.querySelector(".voice-btn");
    const LABEL_PLAY = icon("play", "playic") + " 播放语音播报";
    const LABEL_PAUSE = "⏸ 暂停播报";
    function fmtPct(){ try { if (box && box.duration && isFinite(box.duration) && box.buffered.length) {
        var e = box.buffered.end(box.buffered.length - 1);
        return Math.min(100, Math.round(e / box.duration * 100));
      } } catch(e){} return null; }
    if (btn) {
      // 下载阶段：显示进度，提示可提前点播放
      function markLoading(){
        var p = fmtPct();
        btn.innerHTML = "⏳ 语音下载中" + (p !== null ? " " + p + "%" : "") + "（点此可先播放）";
        btn.dataset.loading = "1";
      }
      if (box && box.readyState < 3) markLoading();
      if (box) {
        box.addEventListener("progress", function(){ if (box.readyState < 3 && btn.dataset.loading === "1") markLoading(); });
        box.addEventListener("canplaythrough", function(){ btn.dataset.loading = ""; if (box.paused) btn.innerHTML = LABEL_PLAY; });
        box.addEventListener("canplay", function(){ btn.dataset.loading = ""; if (box.paused) btn.innerHTML = LABEL_PLAY; });
        box.addEventListener("loadeddata", function(){ btn.dataset.loading = ""; if (box.paused) btn.innerHTML = LABEL_PLAY; });
      }
      btn.innerHTML = LABEL_PLAY;
      btn.addEventListener("click", function () {
        if (!box) return;
        if (box.paused) {
          try { var pr = box.play(); if (pr && pr.then) pr.catch(function(){}); } catch (e) {}
          btn.innerHTML = LABEL_PAUSE;
        } else {
          box.pause(); btn.innerHTML = LABEL_PLAY;
        }
      });
      if (box) box.addEventListener("ended", function () { btn.innerHTML = LABEL_PLAY; });
      if (box) box.addEventListener("pause", function () { btn.innerHTML = LABEL_PLAY; });
      if (box) box.addEventListener("playing", function () { btn.innerHTML = LABEL_PAUSE; });
    }
    el.style.display = "";
  }

  function paletteDef(series) {
    return ["#4fc3f7", "#66bb6a", "#ffa726", "#ab47bc", "#ef5350", "#ffd54f"];
