  /* ---------- 短单元格不折行标记 ----------
     字号放大后，短文本（如「存续」「持服饰 37%」）在窄列里会被折成两行，
     视觉上显得碎裂。CSS 无法按内容长度判断，故在此按字符数打标。
     阈值 10 字：中文 10 字在 14px 下约 140px，绝大多数表格列容得下。 */
  /* ---------- 移动端表格卡片化：按 thead 列名给每个 td 打 data-label ----------
     桌面不受影响；≤860px 时 CSS 用 data-label 渲染成「列名 + 值」的竖排卡片，
     从根上消除表格 min-width 导致的横向溢出。 */
  function labelTableCells() {
    document.querySelectorAll(".brand-table").forEach(function (tb) {
      const heads = Array.prototype.map.call(tb.querySelectorAll("thead th"), function (th) {
        return (th.textContent || "").trim();
      });
      if (!heads.length) return;
      tb.querySelectorAll("tbody tr").forEach(function (tr) {
        Array.prototype.forEach.call(tr.children, function (td, i) {
          const lbl = heads[i] || "";
          if (lbl && !td.hasAttribute("data-label")) td.setAttribute("data-label", lbl);
        });
      });
    });
  }

  function markShortCells() {
    document.querySelectorAll(".brand-table td, .brand-table th").forEach(function (cell) {
      const t = (cell.textContent || "").trim();
      if (!t) return;
      // 汉字按 1 算，ASCII 按 0.5 算，估算视觉宽度
      let widthUnits = 0;
      for (const ch of t) widthUnits += /[\u4e00-\u9fa5\u3000-\u303f]/.test(ch) ? 1 : 0.55;
      // 两阶段法：
      // 阶段一（此处）：按字符权重估算，短的先打 nowrap，让表格重新分配列宽
      // 阶段二（markShortCells 末尾）：布局稳定后再实测，放不下的撤销 nowrap
      if (widthUnits <= 11) cell.classList.add("cell-nowrap");
    });

    // ---------- 阶段二：布局稳定后实测复核 ----------
    // nowrap 会让表格重新分配列宽，此时再量一次：
    //   若内容仍超出单元格宽度 → 撤销 nowrap，让它正常折行（绝不撑破页面）
    requestAnimationFrame(function () {
      // 窄屏走卡片化布局，撑宽无意义（还会写死 min-width 影响回流），直接跳过
      if (isNarrow()) return;
      // 阶段二：能放下就单行；放不下但只差一点点（≤40%）则撑宽该列，别折
      document.querySelectorAll(".brand-table td.cell-nowrap").forEach(function (cell) {
        const over = cell.scrollWidth - cell.clientWidth;
        if (over <= 2) return;
        if (over <= cell.clientWidth * 0.4) {
          // 差得不多：直接加宽到内容宽度，保持单行
          cell.style.minWidth = (cell.scrollWidth + 2) + "px";
        } else {
          cell.classList.remove("cell-nowrap");
        }
      });
    });
  }

  /* ---------- 通用单板块柱状图调色 ---------- */
  /* ---------- 一键返回顶部 ----------
     右下角悬浮按钮：向下滚动 400px 后淡入，点击平滑回到顶部。
     尊重系统「减少动效」偏好：开启时直接跳转，不做平滑动画。 */
  function renderBackTop() {
    const btn = $("backTop");
    if (!btn) return;
    btn.innerHTML = icon("arrowup", "ic");

    const reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        btn.classList.toggle("show", window.scrollY > 400);
        ticking = false;
      });
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    btn.addEventListener("click", function () {
      if (reduceMotion) {
        window.scrollTo(0, 0);
      } else {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });
  }

  /* ---------- 顶部板块导航吸顶状态（2026-11-07）----------
     导航已改 position: sticky。离开原位时加 .is-stuck 加深阴影，
     让用户看得出"导航现在浮在上面"。窄屏不起作用（走抽屉）。 */
  function bindStickyNav() {
    const nav = document.querySelector(".section-nav");
    if (!nav) return;
    /* 顶栏 .topbar 是 sticky：只在页面顶部占位，滚走之后不再占视口。
       → 导航吸顶应贴 top:0；仅当顶栏仍在视口内时才让位给它。 */
    /* 顶栏 .topbar 是 position:sticky，**始终钉在视口顶部**不滚走，
       所以导航必须让出顶栏高度，否则会被顶栏（z-index 更高）压住。
       实测 chifang：navTop=0 / tbBottom=79 → 重叠 64px，导航文字被标题盖住。 */
    /* 顶栏有两种情况：
       ① sticky（wangyifu 等）：常驻视口顶部 → 导航贴其下沿 bottom
       ② 普通流（chifang/zbt 等）：滚走就没了 → 导航贴 top:0
       判据用 computed position，不能只看 rect。 */
    function navTop() {
      const tb = document.querySelector(".topbar");
      if (!tb) return 0;
      const isSticky = /sticky|fixed/.test(getComputedStyle(tb).position);
      if (!isSticky) return 0;
      const r = tb.getBoundingClientRect();
      return r.bottom > 0 ? Math.round(r.bottom) : 0;
    }
    if (window.innerWidth > 860) nav.style.top = navTop() + "px";
    const io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { nav.classList.toggle("is-stuck", !e.isIntersecting); });
    }, { rootMargin: "0px", threshold: 0 });
    // 用哨兵观测"原位"
    const sentinel = document.createElement("div");
    sentinel.style.cssText = "position:absolute;height:1px;width:1px;pointer-events:none;";
    nav.parentNode.insertBefore(sentinel, nav);
    io.observe(sentinel);
    window.addEventListener("resize", function () {
      if (window.innerWidth > 860) nav.style.top = navTop() + "px";
    });
    window.addEventListener("scroll", function () {
      if (window.innerWidth > 860) nav.style.top = navTop() + "px";
    }, { passive: true });
  }

  /* ---------- 吸底导航条（2026-11-07）----------
     宽屏一行平铺、窄屏横滑；点选跳锚点，滚动时自动高亮当前板块。
     正文底部已留 84px 内边距，故不会遮挡内容。 */
  function renderBottomDock() {
    const secs = (D.sections || []);
    if (!secs.length) return;
    /* 🔴 2026-11-18 陛下旨意：底部导航条不需要（顶部已有章节胶囊，底部重复且遮挡正文）。
       开关放在 data.js 的 meta.bottomDock，默认关闭；要恢复某页只写 meta.bottomDock:true 即可。 */
    if ((D.meta || {}).bottomDock !== true) return;
    let dock = document.getElementById("bottomDock");
    if (!dock) {
      dock = document.createElement("nav");
      dock.id = "bottomDock";
      dock.className = "bottom-dock";
      document.body.appendChild(dock);
    }
    const SHORT = { assets: "手中资产", svc1: "数字化基础", svc2: "传播传承",
                    modes: "合作模式", path: "推进路径", promise: "我们守的规矩" };
    const items = [["overview", "grid", "总览"]].concat(
      secs.map(function (s) {
        const nm = String(s.name || "");
        const short = SHORT[s.id] || nm.split("·")[0].trim() || nm.slice(0, 8);
        return [s.id, s.icon || "chart", short];
      })
    );
    dock.innerHTML = items.map(function (d) {
      return '<a href="#' + d[0] + '" data-target="' + d[0] + '">' + icon(d[1], "ic") +
        "<span>" + esc(d[2]) + "</span></a>";
    }).join("");

    const links = Array.prototype.slice.call(dock.querySelectorAll("a"));
    function highlight() {
      const pos = window.scrollY + 140;
      let idx = 0;
      for (let i = 0; i < items.length; i++) {
        const el = document.getElementById(items[i][0]);
        if (el && el.offsetTop <= pos) idx = i;
      }
      links.forEach(function (a, i) { a.classList.toggle("active", i === idx); });
    }
    let ticking = false;
    window.addEventListener("scroll", function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { highlight(); ticking = false; });
    }, { passive: true });
    highlight();
  }

  /* ============ 启动 ============ */
  /* ---------- 窄屏转向 / 跨断点缩放后重绘图表 ----------
     柱状图在横竖屏切换时需要从「竖柱」换成「横条」，Chart 需重建。
     防抖 300ms，避免拖动窗口时反复重建。 */
  var lastNarrow = null;
  function watchNarrow() {
    lastNarrow = isNarrow();
    var t = null;
    window.addEventListener("resize", function () {
      clearTimeout(t);
      t = setTimeout(function () {
        var now = isNarrow();
        if (now === lastNarrow) return;
        lastNarrow = now;
        ["radarMain", "barModules", "chart-market", "chart-asset"].forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          var inst = Chart.getChart(el);
          if (inst) inst.destroy();
        });
        if (now) { var w = document.querySelector("#barModules"); if (w) { var wr = w.closest(".chart-wrap"); if (wr) wr.style.height = ""; } }
        renderRadar();
        renderBar28();
        (D.sections || []).forEach(function (sec) { if (sec.chart && document.getElementById("chart-" + sec.id)) renderInlineChart(sec); });
      }, 300);
    }, { passive: true });
  }

  document.addEventListener("DOMContentLoaded", function () {
    renderHead();
    renderNav();
    renderMetrics();
    renderVoice();
    renderSections();
    renderPlan();
    renderTimeline();
    renderFooter();
    labelTableCells();
    markShortCells();
    bindStickyNav();
    renderBottomDock();
    renderBackTop();
    setTimeout(function () {
      renderRadar();
      renderBar28();
      watchNarrow();
    }, 50);
  });
})();

</script>
</body>
</html>
